 const hd=['#','Full Name','Code','Title',...days.map(d=>d.getDate()+'\n'+WD[d.getDay()]),...SUM.map(s=>ST[s][0].replace('إجازة ',''))];
 hd.forEach((h,i)=>{const x=ws.getCell(4,i+1);x.value=h;x.font=F({size:i>=4&&i<4+nd?10:11,bold:true,color:W_});x.fill=fl('263A63');x.alignment=mid;x.border={...bd,bottom:{style:'medium',color:{argb:'FFC9A227'}}}});
 ws.getRow(4).height=38;
 EMP.forEach(([n,name,code,job],r)=>{const row=5+r,z=r%2?'F4F6FA':'FFFFFF',cnt={};
  [n,name,Number(code)||code,job].forEach((v,i)=>{const x=ws.getCell(row,i+1);x.value=v;x.font=F({bold:i===1||i>=2,color:i===0?{argb:'FF6B7691'}:i>=2?{argb:'FF000000'}:undefined});x.alignment=i===1?{horizontal:'left',vertical:'middle',indent:1}:mid;x.fill=fl(z);x.border=bd});

   if(v){x.value=ST[v][1];if(a){x.fill=fl('DDE1EA');x.font=F({size:9,color:{argb:'FF6B7691'}})}else{x.fill=fl(HEX[v]);x.font=F({size:10,bold:true,color:v==='P'?{argb:'FF000000'}:v==='Q'?{argb:'FFFF2D2D'}:W_});cnt[v]=(cnt[v]||0)+1}}});
  SUM.forEach((s,i)=>{const x=ws.getCell(row,5+nd+i);x.value=cnt[s]||0;x.font=F({size:12,bold:true,color:{argb:'FF'+HEX[s]}});x.alignment=mid;x.border=bd;x.fill=fl(z)});
  ws.getRow(row).height=26});
 const lr=7+EMP.length;ws.getCell(lr,2).value='دليل الألوان';ws.getCell(lr,2).font=F({bold:true});ws.getCell(lr,2).alignment={horizontal:'left'};
 Object.entries(ST).forEach(([k,v],i)=>{const a=ws.getCell(lr+1+i,1);a.value=v[1];a.font=F({size:10,bold:true,color:k==='P'?{argb:'FF000000'}:k==='Q'?{argb:'FFFF2D2D'}:W_});a.alignment=mid;a.fill=fl(HEX[k]);a.border=bd;const b=ws.getCell(lr+1+i,2);b.value=v[0];b.font=F();b.alignment={horizontal:'left',indent:1}});
 ws.getColumn(1).width=5;ws.getColumn(2).width=30;ws.getColumn(3).width=9;ws.getColumn(4).width=13;

 return W.xlsx.writeBuffer();

 RV={code:String(code),name:e?e[1]:'',date:d,status:v?ST[v][0]:'No record'};
 $('rvd').textContent=d+' — '+RV.name;$('rvs').textContent='Recorded: '+RV.status;$('rvt').value='';$('rve').className='err';$('rve').textContent='';$('rv').style.display='flex'}

 if(!t){m('Write the correction first');return}
 if(!db||!auth||!auth.currentUser){m('Not connected. Please log in again');return}
 try{await db.collection('inbox').doc(Date.now()+'_'+RV.code).set({code:RV.code,name:RV.name,date:RV.date,status:RV.status,text:t.slice(0,900),ts:Date.now(),read:false});
  m('Sent to admin',true);setTimeout(()=>{$('rv').style.display='none'},1200)}
 catch(e){m('Could not send. Please try again')}};
function subInbox(){if(!db||unsubI)return;
 try{unsubI=db.collection('inbox').onSnapshot(s=>{MSG=s.docs.map(d=>Object.assign({id:d.id},d.data())).sort((a,b)=>b.ts-a.ts);
  const n=MSG.filter(m=>!m.read).length;$('inb').querySelector('span').textContent='Inbox'+(n?' ('+n+')':'');if($('ibx').style.display==='flex')showInbox()},()=>{})}catch(e){}}
function showInbox(){const L=$('ibl');L.innerHTML='';if(!MSG.length){L.textContent='No messages yet';return}
 MSG.forEach(m=>{const d=document.createElement('div');d.className='msg'+(m.read?'':' un');
  const h=document.createElement('b');h.textContent=m.name+' ('+m.code+') — '+m.date;
  const s=document.createElement('div');s.textContent='Recorded: '+m.status;
  const c=document.createElement('div');c.textContent='Correction: '+m.text;
  const a=document.createElement('div');a.className='r';
  const r=document.createElement('button');r.textContent=m.read?'Mark unread':'Mark read';r.onclick=()=>{try{db.collection('inbox').doc(m.id).update({read:!m.read})}catch(e){}};
  const x=document.createElement('button');x.textContent='Delete';x.onclick=()=>{try{db.collection('inbox').doc(m.id).delete()}catch(e){}};
  a.append(r,x);d.append(h,s,c,a);L.appendChild(d)})}
$('inb').onclick=e=>{e.stopPropagation();showInbox();$('ibx').style.display='flex'};
$('ibc').onclick=()=>{$('ibx').style.display='none'};

 try{const out={exportedAt:new Date().toISOString(),attendance:{},meta:{},inbox:{}};

 catch(e){alert('Backup failed. Please try again.')}
 s.textContent='Backup'};
