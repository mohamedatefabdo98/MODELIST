html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Cairo,Arial,sans-serif}
header{position:relative;background:var(--band);color:#fff;text-align:center;padding:18px 12px 14px;border-bottom:5px solid var(--gold)}
header h1{margin:0;font-size:30px;letter-spacing:8px;font-weight:800}
header p{margin:4px 0 0;color:var(--gold);font-weight:600}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center;padding:14px}
.bar button,.bar select{font:inherit;border:1px solid var(--ln);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 14px;cursor:pointer;font-weight:700}
.frow{position:sticky;left:0;width:max-content;max-width:100%;padding:10px 12px}
.frow select{font:inherit;font-weight:700;border:1px solid var(--gold);background:var(--card);color:var(--tx);border-radius:10px;padding:6px 14px;cursor:pointer;width:260px;max-width:100%}
.per{font-weight:800;font-size:17px;min-width:260px;text-align:center}
.per small{display:block;color:var(--mut);font-weight:600;font-size:13px}
.leg{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:0 12px 10px}
.leg span{display:flex;align-items:center;gap:6px;font-size:13px;background:var(--card);border:1px solid var(--ln);border-radius:20px;padding:3px 10px}
.leg i,.c{font-style:normal;display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#fff}
.leg i{min-width:28px;height:22px;padding:0 4px;border-radius:6px;font-size:11px}
.wrap{margin:0 12px 24px;background:var(--card);border:1px solid var(--ln);border-radius:14px;overflow-x:auto;max-width:100%}
table{border-collapse:separate;border-spacing:0;font-size:13px}
th,td{border-bottom:1px solid var(--ln);border-right:1px solid var(--ln);padding:0;text-align:center;height:38px;white-space:nowrap}
thead th{background:var(--hd);color:#fff;font-weight:700;position:sticky;top:0;z-index:2;padding:4px 6px}
th.d{min-width:47px;cursor:pointer;line-height:1.2}th.d small{display:block;font-weight:400;opacity:.8;font-size:9.5px}
th.d.t{background:var(--gold);color:#14213d}
.nm{position:sticky;left:0;z-index:3;background:var(--card);padding:0 12px;text-align:left;min-width:230px;font-weight:700;}
thead .nm{background:var(--hd);z-index:4}
.nm b{color:var(--mut);font-weight:600;margin-right:8px}
.inf{padding:0 10px;color:var(--mut)}
td.inf{color:var(--ink);font-weight:700}
td.cell{cursor:pointer;min-width:47px;height:38px}td.wk{background:var(--wk)}td.t{background:var(--today)}
.c{width:28px;height:28px;border-radius:8px;font-size:12px}
.c.F{background:var(--F)}.c.P{background:var(--P);color:#000}.c.A{background:var(--A)}.c.C{background:var(--C)}.c.S{background:var(--S)}.c.X{background:var(--X)}.c.H{background:var(--H)}.c.O{background:var(--O)}.c.L{background:var(--L)}
.c.Q{background:#000;color:#ff2d2d;box-shadow:0 0 0 1px #ff2d2d66}
.c.auto{opacity:.45}
.cell .c{width:auto;min-width:40px;height:auto;min-height:28px;padding:1px 2px;line-height:1.1;font-size:13px;white-space:normal;border-radius:7px}

/* ---------- Edit employees ---------- */
function renum(){[...document.querySelectorAll('#elist .er')].forEach((d,i)=>{d.querySelector('b').textContent=i+1})}
function rekey(o,map){const r={};for(const k in o){const i=k.indexOf('_'),c=k.slice(0,i);r[Object.prototype.hasOwnProperty.call(map,c)?map[c]+k.slice(i):k]=o[k]}return r}
$('edt').onclick=e=>{e.stopPropagation();
 const L=$('elist');L.innerHTML='';
 allEmp().forEach(r=>{
  const d=document.createElement('div');d.className='er';
  d.dataset.oc=String(r[2]);d.dataset.on=r[1];d.dataset.oj=r[3];
  d.innerHTML='<b></b><input class="en" dir="ltr" placeholder="Full Name"><input class="ec" dir="ltr" placeholder="Code"><input class="ej" dir="ltr" placeholder="Title"><button class="del" title="Delete">🗑</button>';
  d.querySelector('.en').value=r[1];d.querySelector('.ec').value=r[2];d.querySelector('.ej').value=r[3];
  L.appendChild(d)});
 renum();$('eer').textContent='';$('edlg').style.display='flex'};

$('es').onclick=()=>{
 const er=$('eer'),seen={};
 const rows=[...document.querySelectorAll('#elist .er')].map(d=>({oc:d.dataset.oc,on:d.dataset.on,oj:d.dataset.oj,name:d.querySelector('.en').value.trim(),code:d.querySelector('.ec').value.trim(),job:d.querySelector('.ej').value.trim()}));
 for(const r of rows){
  if(!r.name||!r.code){er.textContent='Enter full name and code for every employee';return}
  if(/[\u0600-\u06FF]/.test(r.name+r.job)){er.textContent='Please enter name and title in English';return}
  if(/[\s_]/.test(r.code)){er.textContent='Code must not contain spaces or underscores';return}
  if(seen[r.code]){er.textContent='Duplicate code: '+r.code;return}
  seen[r.code]=1}
 const isExt=c=>!EMP.some(e=>String(e[2])===String(c)),keep=new Set(rows.map(r=>r.oc));
 allEmp().forEach(r=>{const oc=String(r[2]);if(!keep.has(oc)&&isExt(oc)&&HID.indexOf(oc)<0)HID.push(oc)});
 const map={},ne=[];
 rows.forEach(r=>{
  const same=r.name===r.on&&r.code===r.oc&&(r.job||'-')===r.oj;
  if(r.code!==r.oc)map[r.oc]=r.code;
  if(isExt(r.oc)){if(same)return;if(HID.indexOf(r.oc)<0)HID.push(r.oc)}
  ne.push([0,r.name,r.code,r.job||'-'])});
 ne.forEach((r,i)=>r[0]=i+1);
 if(Object.keys(map).length){
  cells=rekey(cells,map);
  try{const ks=[];for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('att')===0)ks.push(k)}
   ks.forEach(k=>{if(k==='att'+key())return;try{localStorage.setItem(k,JSON.stringify(rekey(JSON.parse(localStorage.getItem(k)||'{}'),map)))}catch(e){}})}catch(e){}}
 EMP=ne;saveEmp();save();$('edlg').style.display='none';render()};
async function makeXlsx(ExcelJS,ctx){
 const {EMP,days,eff,ST,SUM,WD,MN,start,HEX}=ctx;
 const W=new ExcelJS.Workbook(),ws=W.addWorksheet('الحضور',{views:[{rightToLeft:false,showGridLines:false,state:'frozen',xSplit:2,ySplit:4}],pageSetup:{orientation:'landscape',paperSize:8,fitToPage:true,fitToWidth:1,fitToHeight:0,horizontalCentered:true}});
 const nc=4+days.length+SUM.length,e=days[days.length-1],nd=days.length;
 const fl=c=>({type:'pattern',pattern:'solid',fgColor:{argb:'FF'+c}}),mid={horizontal:'center',vertical:'middle',wrapText:true};
 const F=o=>Object.assign({name:'Arial',size:11,color:{argb:'FF14213D'}},o),W_={argb:'FFFFFFFF'};
 const ln={style:'thin',color:{argb:'FFD5DAE5'}},bd={top:ln,bottom:ln,left:ln,right:ln};
 for(let i=1;i<=nc;i++){ws.getCell(1,i).fill=fl('14213D');ws.getCell(2,i).fill=fl('C9A227')}
 ws.getRow(1).height=50;ws.getRow(2).height=5;
 ws.mergeCells(1,1,1,10);let c=ws.getCell(1,1);c.value='MODELIST';c.font=F({size:26,bold:true,color:W_});c.alignment=mid;
 ws.mergeCells(3,1,3,10);c=ws.getCell(3,1);
 c.value='كشف الحضور والغياب — شهر '+MN[e.getMonth()]+' '+e.getFullYear()+'  (من '+start.getDate()+' '+MN[start.getMonth()]+' إلى '+e.getDate()+' '+MN[e.getMonth()]+')';
 c.font=F({size:12,bold:true});c.alignment=mid;ws.getRow(3).height=28;
 const hd=['#','Full Name','Code','Title',...days.map(d=>d.getDate()+'\n'+WD[d.getDay()]),...SUM.map(s=>ST[s][0].replace('إجازة ',''))];
 hd.forEach((h,i)=>{const x=ws.getCell(4,i+1);x.value=h;x.font=F({size:i>=4&&i<4+nd?10:11,bold:true,color:W_});x.fill=fl('263A63');x.alignment=mid;x.border={...bd,bottom:{style:'medium',color:{argb:'FFC9A227'}}}});
 ws.getRow(4).height=38;
 EMP.forEach(([n,name,code,job],r)=>{const row=5+r,z=r%2?'F4F6FA':'FFFFFF',cnt={};
  [n,name,Number(code)||code,job].forEach((v,i)=>{const x=ws.getCell(row,i+1);x.value=v;x.font=F({bold:i===1||i>=2,color:i===0?{argb:'FF6B7691'}:i>=2?{argb:'FF000000'}:undefined});x.alignment=i===1?{horizontal:'left',vertical:'middle',indent:1}:mid;x.fill=fl(z);x.border=bd});
  days.forEach((d,i)=>{const[v,a]=eff(code,d);const x=ws.getCell(row,5+i);x.alignment=mid;x.border=bd;x.fill=fl(d.getDay()===5?'EEF0F6':z);
   if(v){x.value=ST[v][1];if(a){x.fill=fl('DDE1EA');x.font=F({size:9,color:{argb:'FF6B7691'}})}else{x.fill=fl(HEX[v]);x.font=F({size:10,bold:true,color:v==='P'?{argb:'FF000000'}:v==='Q'?{argb:'FFFF2D2D'}:W_});cnt[v]=(cnt[v]||0)+1}}});
  SUM.forEach((s,i)=>{const x=ws.getCell(row,5+nd+i);x.value=cnt[s]||0;x.font=F({size:12,bold:true,color:{argb:'FF'+HEX[s]}});x.alignment=mid;x.border=bd;x.fill=fl(z)});
  ws.getRow(row).height=26});
 const lr=7+EMP.length;ws.getCell(lr,2).value='دليل الألوان';ws.getCell(lr,2).font=F({bold:true});ws.getCell(lr,2).alignment={horizontal:'left'};
 Object.entries(ST).forEach(([k,v],i)=>{const a=ws.getCell(lr+1+i,1);a.value=v[1];a.font=F({size:10,bold:true,color:k==='P'?{argb:'FF000000'}:k==='Q'?{argb:'FFFF2D2D'}:W_});a.alignment=mid;a.fill=fl(HEX[k]);a.border=bd;const b=ws.getCell(lr+1+i,2);b.value=v[0];b.font=F();b.alignment={horizontal:'left',indent:1}});
 ws.getColumn(1).width=5;ws.getColumn(2).width=30;ws.getColumn(3).width=9;ws.getColumn(4).width=13;
 for(let i=5;i<=nc;i++)ws.getColumn(i).width=i<5+nd?7:9;
 return W.xlsx.writeBuffer();
}


const HEX={P:'1F9D62',A:'D6384B',C:'3D9BFF',S:'E8830C',X:'8A4FD1',L:'B99A00',Q:'000000',H:'0E9AA7',F:'8A93A6',O:'8A93A6'};
async function saveFile(fn,data){
 try{const dl=await window.claude.use('downloads');if(dl){await dl.save({filename:fn,data});return}}catch(er){if(er&&er.code==='declined')return}
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data]));a.download=fn;a.click()}
$('ex').onclick=async()=>{const b=await makeXlsx(ExcelJS,{EMP:allEmp(),days,eff,ST,SUM,WD,MN,start,HEX});await saveFile('MODELIST_attendance_'+key()+'.xlsx',b)};
$('pdf').onclick=async()=>{

 const box=document.createElement('div');box.id='pr';
 const hd=document.querySelector('header').cloneNode(true);hd.querySelector('.tools').remove();

 box.querySelectorAll('span.c.P').forEach(s=>s.remove());
 document.body.appendChild(box);
 try{
  await (document.fonts&&document.fonts.ready);
  const cv=await html2canvas(box,{scale:2,backgroundColor:'#f4f6fa'}),w=cv.width/2,h=cv.height/2;
  const doc=new window.jspdf.jsPDF({orientation:w>h?'l':'p',unit:'px',format:[w,h],hotfixes:['px_scaling']});
  doc.addImage(cv.toDataURL('image/jpeg',0.95),'JPEG',0,0,w,h);
  await saveFile('MODELIST_attendance_'+key()+'.pdf',doc.output('arraybuffer'));
 }finally{box.remove();prev?root.setAttribute('data-theme',prev):root.removeAttribute('data-theme')}
};

 if(!db){applyPatch();render()}})();
